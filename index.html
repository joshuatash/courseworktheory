<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mulago Hospital – Outpatient Appointment Request</title>
</head>

<body>
    <h1>Mulago National Referral Hospital</h1>
    <h2>Outpatient Appointment Request Form</h2>

    <form action="/appointments/submit" method="post">
        <p>
            <label for="fullname">Full name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3" maxlength="80"
                placeholder="e.g. Aisha Nakato">
        </p>
        <p>
            <label for="phone">Phone number (Ugandan):</label><br>
            <input type="tel" id="phone" name="phone" required placeholder="e.g. 0771234567">
        </p>
        <p>
            <label for="email">Email address:</label><br>
            <input type="email" id="email" name="email" required maxlength="100" placeholder="you@example.com">
        </p>
        <p>
            <label for="dob">Date of birth:</label><br>
            <input type="date" id="dob" name="dob" required min="1900-01-01" max="2026-12-31">
        </p>
        <legend>Patient type:</legend>
        <input type="radio" id="newpatient" name="patienttype" value="New" required>
        <label for="newpatient">New</label>

        <input type="radio" id="returning" name="patienttype" value="Returning">
        <label for="returning">Returning</label>
        <p>
            <label for="clinic">Preferred clinic:</label><br>
            <select id="clinic" name="clinic" required>
                <option value="">-- Select a clinic --</option>
                <option value="general">General Outpatient Clinic</option>
                <option value="paediatrics">Paediatrics Clinic</option>
                <option value="antenatal">Antenatal / Postnatal Clinic</option>
                <option value="cardiology">Cardiology Clinic</option>
                <option value="dermatology">Dermatology Clinic</option>
                <option value="ophthalmology">Ophthalmology (Eye) Clinic</option>
                <option value="dental">Dental Clinic</option>
            </select>
        </p>
        <p>
            <label for="appdate">Preferred date:</label><br>
            <input type="date" id="appdate" name="appdate" required min="2026-11-09">
        </p>
        <p>
            <label for="apptime">Preferred time:</label><br>
            <input type="time" id="apptime" name="apptime" required min="08:00" max="17:00">
        </p>
        <p>
            <label for="symptoms">Brief description of symptoms:</label><br>
            <textarea id="symptoms" name="symptoms" rows="5" cols="40" maxlength="500"
                placeholder="Describe your symptoms (max 500 characters)"></textarea>
        </p>
        <p>
            <button type="submit">Request Appointment</button>
            <button type="reset">Clear Form</button>
        </p>
    </form>
</body>

</html>
